[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-guard"
version = "0.1.0"
description = "Model-aware Chat-to-Work handoffs, routing recommendations, and execution preflight."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Handoff Guard contributors" }]
keywords = ["coding-agents", "handoff", "model-routing", "preflight"]

[project.optional-dependencies]
windows-installer = ["pywinauto>=0.6.9,<0.7", "pyinstaller>=6.0,<7"]

[tool.setuptools.packages.find]
include = ["handoff_guard_installer*"]
